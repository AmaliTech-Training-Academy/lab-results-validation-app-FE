
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime          # build-from-source stage (compiles dist/ in Docker)
    container_name: lab-frontend
    ports:
      - "3000:8080"            # host 3000 → nginx 8080 (8080 is taken by the backend)
    extra_hosts:
      # Lets the container resolve the host machine (needed on Linux; already
      # built in on Docker Desktop for Windows/Mac, harmless to keep).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
