name: CI

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
      - 'feat/**'
      - 'chore/**'
      - 'hotfix/**'
      - 'fix/**'
      - 'bugfix/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches:
      - dev
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  # The Vue app lives in this subdirectory, not the repo root.
  WORKDIR: frontend

jobs:
  build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKDIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      # Remove this step if the app is plain JS (no vue-tsc / TypeScript).
      - name: Type-check (vue-tsc)
        run: npm run type-check

      - name: Test
        run: npm run test:coverage

      - name: Build (production)
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          # `defaults.working-directory` does NOT apply to actions, so the path
          # is relative to the repo root.
          path: ${{ env.WORKDIR }}/dist
          retention-days: 7
          if-no-files-found: error
