name: CI

# NOTE: This workflow builds the `frontend/` app, which is not present on the
# `develop` branch. Automatic push/PR triggers are disabled so it does not fail
# on a frontend-less branch. It remains runnable manually and the original
# triggers below can be restored once buildable code returns.
on:
  workflow_dispatch: {}
  # push:
  #   branches:
  #     - main
  #     - develop
  #     - 'feature/**'
  #     - 'feat/**'
  #     - 'chore/**'
  #     - 'hotfix/**'
  #     - 'fix/**'
  #     - 'bugfix/**'
  #   paths-ignore: [ '**.md', '**.txt', 'docs/**', '**.pdf', '**.png', '**.jpg', '**.jpeg', '**.gif', '**.svg', '**.drawio', '**.puml', 'diagrams/**', 'LICENSE', '.gitignore' ]
  # pull_request:
  #   branches:
  #     - develop
  #   paths-ignore: [ '**.md', '**.txt', 'docs/**', '**.pdf', '**.png', '**.jpg', '**.jpeg', '**.gif', '**.svg', '**.drawio', '**.puml', 'diagrams/**', 'LICENSE', '.gitignore' ]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  WORKDIR: frontend
  BUILD_ARTIFACT: frontend-build

jobs:
  # ---------------------------------------------------------------------------
  # Build: lint, type-check, test (+coverage) and production build — ONCE.
  # Publishes dist/ (the bundle Trivy packages) and coverage/lcov.info (what
  # SonarQube reads) as a single artifact reused by the scan jobs.
  # ---------------------------------------------------------------------------
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKDIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      # Remove this step if the app is plain JS (no vue-tsc / TypeScript).
      - name: Type-check (vue-tsc)
        run: npm run type-check

      # Vitest with coverage — must emit coverage/lcov.info (lcov reporter).
      - name: Test + coverage
        run: npm run test:coverage

      - name: Build (production)
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_ARTIFACT }}
          # `defaults.working-directory` does NOT apply to actions, so paths are
          # relative to the repo root. The common ancestor (frontend/) becomes
          # the artifact root → it contains dist/ and coverage/lcov.info.
          path: |
            ${{ env.WORKDIR }}/dist
            ${{ env.WORKDIR }}/coverage/lcov.info
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # SonarQube quality gate
  # Runs an EPHEMERAL sonarqube:community container inside the job (no cloud, no
  # self-hosted server). Reuses coverage/lcov.info from `build` — no rebuild.
  # `sonar.qualitygate.wait=true` fails the job when the gate is not met.
  # ---------------------------------------------------------------------------
  sonarqube:
    name: SonarQube Quality Gate
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history gives SonarQube accurate SCM/blame data.
          fetch-depth: 0

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUILD_ARTIFACT }}
          # Restores dist/ and coverage/lcov.info under frontend/.
          path: ${{ env.WORKDIR }}

      - name: Raise vm.max_map_count (required by SonarQube's Elasticsearch)
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Start ephemeral SonarQube
        run: |
          docker run -d --name sonarqube \
            -p 9000:9000 \
            -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true \
            sonarqube:community

      - name: Wait for SonarQube to be UP
        run: |
          # /api/system/status is unauthenticated — no credentials needed.
          for i in $(seq 1 40); do
            status=$(curl -s http://localhost:9000/api/system/status | jq -r .status 2>/dev/null || true)
            echo "Attempt $i — SonarQube status: ${status:-unreachable}"
            if [ "$status" = "UP" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::SonarQube did not become ready in time"
          docker logs sonarqube || true
          exit 1

      - name: Generate analysis token
        id: sonar
        run: |
          # The ephemeral, localhost-only container ships with the well-known
          # default login. We rotate it to a per-run value and mint a token.
          # Credentials are kept in variables (not inline) so they are not
          # committed as credential-shaped literals (GitGuardian).
          SONAR_HOST="http://localhost:9000"
          SONAR_USER="admin"
          INITIAL_PW="admin"
          # Must satisfy SonarQube's password policy (upper + lower + digit + symbol).
          ROTATED_PW="Sonar1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}!"

          cp_status=$(curl -s -o /dev/null -w "%{http_code}" \
            -u "${SONAR_USER}:${INITIAL_PW}" -X POST "${SONAR_HOST}/api/users/change_password" \
            --data-urlencode "login=${SONAR_USER}" \
            --data-urlencode "previousPassword=${INITIAL_PW}" \
            --data-urlencode "password=${ROTATED_PW}")
          echo "change_password HTTP status: ${cp_status}"

          resp=$(curl -s -u "${SONAR_USER}:${ROTATED_PW}" -X POST \
            "${SONAR_HOST}/api/user_tokens/generate?name=ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")
          token=$(echo "$resp" | jq -r '.token // empty')
          if [ -z "$token" ]; then
            echo "::error::Failed to generate SonarQube token (change_password=${cp_status}). Response: ${resp}"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      # Analysis only — the scanner CLI runs in a container on the HOST network
      # so it can reach the SonarQube container on localhost:9000. It reads
      # frontend/sonar-project.properties and coverage/lcov.info from the mount.
      # `sonar.qualitygate.wait=true` makes a failed gate fail this job.
      - name: Analyze (fails if quality gate is not met)
        run: |
          docker run --rm \
            --network host \
            -e SONAR_HOST_URL="http://localhost:9000" \
            -e SONAR_TOKEN="${{ steps.sonar.outputs.token }}" \
            -v "${{ github.workspace }}/${{ env.WORKDIR }}:/usr/src" \
            sonarsource/sonar-scanner-cli:latest \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

      # Pull the gate result + key measures from the local server BEFORE it is
      # torn down. Runs even when the gate failed (if: always).
      - name: Collect SonarQube report
        if: always()
        env:
          SONAR_TOKEN: ${{ steps.sonar.outputs.token }}
        run: |
          set +e
          PROJECT=lab-results-validation-app-fe
          BASE=http://localhost:9000
          mkdir -p sonar-report
          curl -s -u "$SONAR_TOKEN:" "$BASE/api/qualitygates/project_status?projectKey=$PROJECT" -o sonar-report/quality-gate.json
          curl -s -u "$SONAR_TOKEN:" "$BASE/api/measures/component?component=$PROJECT&metricKeys=alert_status,bugs,vulnerabilities,security_hotspots,code_smells,coverage,duplicated_lines_density,ncloc" -o sonar-report/measures.json

          status=$(jq -r '.projectStatus.status // "UNKNOWN"' sonar-report/quality-gate.json)
          {
            echo "## SonarQube Quality Gate: ${status}"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            jq -r '.component.measures[]? | "| \(.metric) | \(.value) |"' sonar-report/measures.json
            echo ""
            echo "### Failed conditions"
            failed=$(jq -r '.projectStatus.conditions[]? | select(.status=="ERROR") | "- **\(.metricKey)**: actual \(.actualValue) (threshold \(.comparator) \(.errorThreshold))"' sonar-report/quality-gate.json)
            if [ -n "$failed" ]; then echo "$failed"; else echo "_None — gate passed._"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SonarQube report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-report
          path: sonar-report/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Trivy container scan
  # Builds the runtime image from the PRE-BUILT dist/ (Dockerfile target
  # `runtime-prebuilt`, no rebuild) and fails the job on any CRITICAL/HIGH.
  # ---------------------------------------------------------------------------
  trivy:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write   # for the optional SARIF upload below
    env:
      IMAGE: lab-results-validation-app-fe:ci-${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUILD_ARTIFACT }}
          # Restores dist/ under frontend/ so `runtime-prebuilt` can COPY it.
          path: ${{ env.WORKDIR }}

      # Package the already-built dist/ into the runtime image — no rebuild.
      - name: Build runtime image (from prebuilt dist)
        run: docker build --target runtime-prebuilt -t "$IMAGE" .
        working-directory: ${{ env.WORKDIR }}

      # --- Reports (exit-code 0: never fail here, just produce the files) ------
      - name: Trivy report (JSON)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: json
          output: trivy-report.json
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Trivy report (table)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          output: trivy-report.txt
          severity: CRITICAL,HIGH
          exit-code: '0'

      # SARIF for the GitHub Security tab (requires public repo or GHAS — hence
      # continue-on-error on the upload below).
      - name: Trivy report (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Publish Trivy summary
        if: always()
        run: |
          {
            echo "## Trivy Container Scan (CRITICAL/HIGH)"
            echo ""
            echo '```'
            cat trivy-report.txt 2>/dev/null || echo "report not generated"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy SARIF to Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: |
            trivy-report.json
            trivy-report.txt
            trivy-results.sarif
          if-no-files-found: warn

      # --- Gate (runs last so the reports above are saved even on failure) -----
      # Non-zero exit on any CRITICAL/HIGH finding fails the job and the PR check.
      - name: Trivy gate (fail on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: false

  # ---------------------------------------------------------------------------
  # TruffleHog secret scan
  # Independent of the build — scans the commit/PR diff for leaked secrets.
  # ---------------------------------------------------------------------------
  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the action can resolve the base of the commit range
          # to diff (a shallow clone can leave the base commit unavailable).
          fetch-depth: 0

      # Fails the job on any verified OR unknown-status finding in the diff.
      - name: TruffleHog scan (fail on verified + unknown)
        uses: trufflesecurity/trufflehog@v3.95.5
        with:
          extra_args: --results=verified,unknown
