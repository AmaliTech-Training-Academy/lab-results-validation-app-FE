name: Deploy Dev (frontend)

on:
  push:
    branches: [develop]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  ECR_REPO: labresults-dev-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPO"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:dev" frontend
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:dev"

      - name: Deploy via SSM
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          INSTANCE_ID: ${{ secrets.DEPLOY_INSTANCE_ID }}
        run: |
          set -euo pipefail

          ECR_TOKEN=$(aws ecr get-login-password --region "$AWS_REGION")
          echo "::add-mask::$ECR_TOKEN"

          SCRIPT=$(cat <<EOF
          set -eu
          echo '$ECR_TOKEN' | docker login --username AWS --password-stdin '$REGISTRY'
          cd /opt/app
          docker compose pull frontend
          docker compose up -d frontend
          docker image prune -f
          EOF
          )

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":[$(jq -Rs . <<< "$SCRIPT")]}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: $COMMAND_ID"

          STATUS="Pending"
          for i in $(seq 1 30); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                echo "SSM command ended with status: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardErrorContent" \
                  --output text
                exit 1
                ;;
              *) ;;
            esac
          done

          if [ "$STATUS" != "Success" ]; then
            echo "SSM command did not complete in time (last status: $STATUS)"
            exit 1
          fi

          echo "Deploy succeeded"
