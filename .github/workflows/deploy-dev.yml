name: Deploy Dev (frontend)

# NOTE: Deploys the `frontend/` app, which is not present on `develop`.
# Automatic push trigger is disabled so it does not run on a frontend-less
# branch; kept runnable manually. Restore the push trigger when frontend returns.
on:
  # push:
  #   branches: [develop]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  ECR_REPO: labresults-dev-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPO"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:dev" frontend
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:dev"

      - name: Deploy over SSH
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i $HOME/.ssh/key"

          ECR_TOKEN=$(aws ecr get-login-password --region "$AWS_REGION")
          echo "::add-mask::$ECR_TOKEN"
          ssh $SSH_OPTS ubuntu@"$SSH_HOST" \
            "echo '$ECR_TOKEN' | docker login --username AWS --password-stdin '$REGISTRY' && cd /opt/app && docker compose pull frontend && docker compose up -d frontend && docker image prune -f"
