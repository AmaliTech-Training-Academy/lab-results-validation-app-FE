server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — deep links / refresh work
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Reverse-proxy API calls to the backend. The SPA calls a relative "/api/...",
    # so no backend host is baked into the bundle.
    #
    # Target = host.docker.internal:8080 → the backend that its OWN compose
    # publishes on the host's port 8080 (the two stacks are separate compose
    # projects). No trailing slash on proxy_pass → the /api prefix is preserved
    # (the backend serves its endpoints under /api).
    #
    # If you later put both stacks on ONE shared Docker network, change the
    # target to the backend's service name, e.g. http://app:8080.
    location /api/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
