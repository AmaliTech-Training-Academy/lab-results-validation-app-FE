sonar.projectKey=lab-results-validation-app-fe
sonar.projectName=lab-results-validation-app-fe

# Source / test layout (relative to this file = the frontend/ project root).
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.js,**/*.test.js,**/__tests__/**

# Keep generated/vendored/config code out of the analysis.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/*.test.ts,**/*.spec.js,**/*.test.js,**/*.config.*,**/*.d.ts,**/env.d.ts

# Coverage — produced by Vitest (lcov reporter) in the `build` job.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
